services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scmgogo-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://127.0.0.1:8000/health
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scmgogo-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped