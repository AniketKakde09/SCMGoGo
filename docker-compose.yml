services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"

    volumes:
      - datasets:/app/datasets

    environment:
      - FOREMAN_DATASETS_DIR=/app/datasets
      - CORS_ALLOW_ORIGINS=*

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile

    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy


volumes:
  datasets:
    driver: local