<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="badgeClip">
      <rect x="0" y="0" width="600" height="600" rx="120" ry="120"/>
    </clipPath>
  </defs>

  <!-- Background badge -->
  <rect x="0" y="0" width="600" height="600" rx="120" ry="120" fill="#1E293B"/>

  <!-- Subtle accent split -->
  <g clip-path="url(#badgeClip)">
    <rect x="0" y="0" width="300" height="600" fill="#1E293B"/>
    <rect x="300" y="0" width="300" height="600" fill="#0F172A"/>
  </g>

  <!-- Monogram: interlocking S / G forms -->
  <g fill="none" stroke="#38BDF8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- S stroke -->
    <path d="M 235 180
             C 175 180, 150 215, 150 250
             C 150 285, 180 300, 230 300
             C 280 300, 310 315, 310 350
             C 310 385, 285 420, 225 420"/>
  </g>

  <g fill="none" stroke="#F8FAFC" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- G stroke (open circle with inward bar) -->
    <path d="M 450 220
             A 100 100 0 1 0 450 380
             L 450 305
             L 390 305"/>
  </g>

  <!-- Small orbiting dot accents (sprint / agile cycle motif) -->
  <circle cx="150" cy="180" r="12" fill="#38BDF8"/>
  <circle cx="450" cy="420" r="12" fill="#F8FAFC"/>

  <!-- Wordmark -->
  <text x="300" y="500" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="4">SMGG</text>
  <text x="300" y="535" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#94A3B8" text-anchor="middle" letter-spacing="3">SCRUM MASTER GOGO</text>
</svg>